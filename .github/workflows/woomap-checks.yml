name: WooMap checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/woomap-supabase-build-env]
  workflow_dispatch:

jobs:
  woomap-build:
    name: WooMap TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build

  woomap-two-account-security:
    name: WooMap two-account Supabase authorization and Realtime test
    runs-on: ubuntu-latest
    needs: woomap-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run two-account integration test when staging credentials are configured
        env:
          WOOMAP_TEST_SUPABASE_URL: ${{ secrets.WOOMAP_TEST_SUPABASE_URL }}
          WOOMAP_TEST_SUPABASE_KEY: ${{ secrets.WOOMAP_TEST_SUPABASE_KEY }}
          WOOMAP_TEST_USER_A_EMAIL: ${{ secrets.WOOMAP_TEST_USER_A_EMAIL }}
          WOOMAP_TEST_USER_A_PASSWORD: ${{ secrets.WOOMAP_TEST_USER_A_PASSWORD }}
          WOOMAP_TEST_USER_B_EMAIL: ${{ secrets.WOOMAP_TEST_USER_B_EMAIL }}
          WOOMAP_TEST_USER_B_PASSWORD: ${{ secrets.WOOMAP_TEST_USER_B_PASSWORD }}
        run: |
          if [ -z "$WOOMAP_TEST_SUPABASE_URL" ] || [ -z "$WOOMAP_TEST_SUPABASE_KEY" ] || [ -z "$WOOMAP_TEST_USER_A_EMAIL" ] || [ -z "$WOOMAP_TEST_USER_A_PASSWORD" ] || [ -z "$WOOMAP_TEST_USER_B_EMAIL" ] || [ -z "$WOOMAP_TEST_USER_B_PASSWORD" ]; then
            echo "::warning::Two-account integration test skipped: configure all WOOMAP_TEST_* repository secrets for a dedicated staging project."
            echo "::error::Two-account test is a required release gate; configure all WOOMAP_TEST_* secrets for a dedicated staging project."
            exit 1
          fi
          npm run test:woomap-security
