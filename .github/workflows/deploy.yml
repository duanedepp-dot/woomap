name: Build and deploy WooMap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: WooMap production build and manual Pages deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build WooMap
        run: npm run build
      - name: Deploy WooMap to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=woomap --branch=main
